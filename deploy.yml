name: Deploy to Fly.io

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy RDP to Fly.io
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: Get App Info
        run: |
          echo "=== معلومات الاتصال بـ RDP ==="
          flyctl ips list
          echo ""
          echo "المستخدم: rdpuser"
          echo "كلمة المرور: SecurePass2025!"
          echo "المنفذ: 3389"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
