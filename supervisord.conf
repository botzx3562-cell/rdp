[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ========== DBUS ==========
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork --nopidfile
autostart=true
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/dbus.log
stderr_logfile=/var/log/supervisor/dbus_err.log
startsecs=3
startretries=10

; ========== xrdp-sesman ==========
[program:xrdp-sesman]
command=/usr/sbin/xrdp-sesman --nodaemon
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xrdp-sesman.log
stderr_logfile=/var/log/supervisor/xrdp-sesman_err.log
startsecs=5
startretries=10

; ========== xrdp ==========
[program:xrdp]
command=/usr/sbin/xrdp --nodaemon
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/xrdp.log
stderr_logfile=/var/log/supervisor/xrdp_err.log
startsecs=5
startretries=10

; ========== (اختياري) x11vnc ==========
; إلغاء التعليق إذا رغبت بتشغيل x11vnc (مثال)
; تأكد من وجود كلمة مرور vnc أو استخدام الخيار -nopw بحذر
;[program:x11vnc]
;command=/usr/bin/x11vnc -forever -shared -display :0 -rfbport 5900 -noxdamage -bg -o /var/log/supervisor/x11vnc.log
;autostart=false
;autorestart=true
;priority=30
;stdout_logfile=/var/log/supervisor/x11vnc.log
;stderr_logfile=/var/log/supervisor/x11vnc_err.log
;startsecs=3
;startretries=5

