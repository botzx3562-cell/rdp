app = "rdp-cncrpq"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]

[http_service]
  internal_port = 3389
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 3389

  [[services.ports]]
    port = 3389

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
